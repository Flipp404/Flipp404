name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%235E83AE&color_dots=%23ebedf0,%23c5d3e5,%239fb7d3,%237a9cc2,%235E83AE
            dist/snake-dark.svg?color_snake=%23F9F5ED&color_dots=%23333333,%23374a63,%23456586,%235E83AE,%238fb0d6

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
