name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%236D28D9&color_dots=%23ebedf0,%23ddd6fe,%23c4b5fd,%23a78bfa,%238B5CF6
            dist/snake-dark.svg?color_snake=%23E879F9&color_dots=%231b1426,%232e1065,%234c1d95,%236D28D9,%238B5CF6

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
